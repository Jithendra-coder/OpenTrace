openapi: 3.0.3
info:
  title: Enterprise Billing & Customer API
  version: '1.4.0'
servers:
  - url: https://api.billing.enterprise.io
paths:
  /v1/customers/subscriptions:
    post:
      summary: Create or update customer subscription
      operationId: createSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_id, plan_id]
              properties:
                customer_id:
                  type: string
                  description: Unique customer identifier
                plan_id:
                  type: string
                  description: Target tier plan code (e.g. enterprise_pro)
      responses:
        '200':
          description: Subscription created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscription_id: {type: string}
                  status: {type: string}
                  active_until: {type: string}
  /v1/customers/{customer_id}:
    get:
      summary: Retrieve customer account details
      operationId: getCustomer
      parameters:
        - name: customer_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Customer record
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string}
                  email: {type: string}
                  tier: {type: string}
