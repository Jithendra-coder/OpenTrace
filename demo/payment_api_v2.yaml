openapi: 3.0.3
info:
  title: Payment API
  version: '2'
servers:
  - url: https://payments.example.com
paths:
  /payments:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currency]
              properties:
                currency: {type: string}
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string}
                  status: {type: string}
  /users:
    get:
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: {type: string}
