openapi: 3.0.3
info:
  title: Sample Payment Service API
  version: '2.0.0'
servers:
  - url: https://payments.example.com
paths:
  /payments:
    post:
      summary: Create payment transaction v2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currency]
              properties:
                currency:
                  type: string
                  description: Three-letter ISO currency code
      responses:
        '200':
          description: Payment created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: integer}
                  status: {type: string}
