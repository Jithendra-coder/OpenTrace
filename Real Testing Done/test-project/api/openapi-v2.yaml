openapi: "3.0.3"
info:
  title: Payment API
  version: "2.0.0"
  description: Internal payment processing API — v2 uses 'price' instead of 'amount'
paths:
  /payments:
    post:
      operationId: createPayment
      summary: Create a new payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - price
                - currency
              properties:
                price:
                  type: number
                  description: Payment price (replaces deprecated 'amount' field)
                currency:
                  type: string
                  description: ISO 4217 currency code
      responses:
        "200":
          description: Payment created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  status:
                    type: string
        "400":
          description: Bad request
  /payments/{payment_id}/refunds:
    post:
      operationId: refundPayment
      summary: Refund a payment
      parameters:
        - name: payment_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Refund created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
