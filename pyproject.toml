[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opentrace"
dynamic = ["version"]
description = "OpenTrace — Automated API Change Impact & Migration Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1.0",
    "networkx>=3.0,<4.0",
    "numpy>=1.24,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "PyYAML>=6.0,<7.0",
    "scikit-learn>=1.3,<2.0",
    "uvicorn>=0.30,<1.0",
    "xgboost>=1.7,<4.0",
]

[project.scripts]
opentrace = "opentrace.cli.main:main"
changemesh = "opentrace.cli.main:main"
specimpact = "opentrace.cli.main:main"

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "mypy>=1.13,<2.0",
    "pytest>=8.3,<9.0",
    "ruff>=0.8,<1.0",
]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.dynamic]
version = {attr = "opentrace.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["backend/opentrace"]
strict = true
warn_unused_configs = true
